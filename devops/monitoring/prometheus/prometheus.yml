global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'bmp-monitor'
    environment: 'local'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:

  # ── Prometheus itself ──────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── BMP Backend (Node.js + prom-client) ───────────────────────────────────
  # Uses host.docker.internal to reach the backend running on the host
  - job_name: 'bmp-backend'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: /metrics
    scrape_interval: 10s

  # ── Node Exporter (host system metrics) ───────────────────────────────────
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

  # ── Blackbox — HTTP endpoint probing ──────────────────────────────────────
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:5000/api/health
          - http://host.docker.internal:5173
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # ── Jenkins (if running) ──────────────────────────────────────────────────
  - job_name: 'jenkins'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: /prometheus
    scrape_interval: 30s
