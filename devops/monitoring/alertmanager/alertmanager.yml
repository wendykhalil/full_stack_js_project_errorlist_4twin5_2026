global:
  resolve_timeout: 5m
  # Configure SMTP for email alerts (update with real credentials)
  # smtp_smarthost: 'smtp.gmail.com:587'
  # smtp_from: 'bmp.alerts@gmail.com'
  # smtp_auth_username: 'bmp.alerts@gmail.com'
  # smtp_auth_password: 'YOUR_APP_PASSWORD'
  # smtp_require_tls: true

route:
  group_by: ['alertname', 'severity', 'team']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  routes:
    - match:
        severity: critical
      receiver: 'critical-receiver'
      repeat_interval: 1h
      continue: true
    - match:
        team: backend
      receiver: 'backend-team'
    - match:
        team: frontend
      receiver: 'frontend-team'
    - match:
        team: infra
      receiver: 'infra-team'

receivers:
  - name: 'default-receiver'
    # Webhook example (replace with real Slack/Teams webhook)
    # webhook_configs:
    #   - url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
