<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>BMP.tn - Plateforme de connexion pour artisans, prescripteurs et fournisseurs en Tunisie</title>
    <meta name="description" content="BMP.tn est la plateforme de référence en Tunisie pour connecter artisans, prescripteurs et fournisseurs. Trouvez des professionnels qualifiés, gérez vos projets et commandez des matériaux en ligne." />
    <meta name="keywords" content="artisans tunisie, prescripteurs, fournisseurs, BTP, construction, marketplace, devis, factures" />
    <meta name="author" content="BMP.tn" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bmp.tn" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://bmp.tn" />
    <meta property="og:title" content="BMP.tn - Plateforme pour artisans et professionnels du BTP" />
    <meta property="og:description" content="Connectez-vous avec des artisans qualifiés, gérez vos projets et commandez des matériaux en ligne sur BMP.tn" />
    <meta property="og:image" content="https://bmp.tn/og-image.jpg" />
    <meta property="og:locale" content="fr_TN" />
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://bmp.tn" />
    <meta name="twitter:title" content="BMP.tn - Plateforme pour artisans et professionnels du BTP" />
    <meta name="twitter:description" content="Connectez-vous avec des artisans qualifiés, gérez vos projets et commandez des matériaux en ligne" />
    <meta name="twitter:image" content="https://bmp.tn/twitter-image.jpg" />
    
    <!-- Preconnect to external domains for faster loading -->
    <link rel="preconnect" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <!-- Preconnect to Stripe (loaded on subscription page) -->
    <link rel="preconnect" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <!-- Preconnect to API server -->
    <link rel="preconnect" href="http://localhost:5000" />
    <!-- Preconnect to IP geolocation (used in api.js) -->
    <link rel="dns-prefetch" href="https://ipapi.co" />
  </head>
  <body>
    <div id="root"></div>
    <!-- ✅ Google Identity script removed - will be loaded dynamically when needed -->
    <script type="module" src="/src/main.jsx"></script>
