# ── Project identification ────────────────────────────────────────────────────
sonar.projectKey=bmp-fullstack
sonar.projectName=BMP.tn Full Stack
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# ── SonarQube server ──────────────────────────────────────────────────────────
sonar.host.url=http://localhost:9000

# ── Sources — only backend modules that Jest instruments ─────────────────────
sonar.sources=backend/src

# ── Tests ─────────────────────────────────────────────────────────────────────
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.js

# ── Coverage ──────────────────────────────────────────────────────────────────
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# ── Exclusions — files NOT instrumented by Jest (would show 0% and drag down) ─
sonar.exclusions=\
  **/node_modules/**,\
  **/coverage/**,\
  **/dist/**,\
  **/uploads/**,\
  **/.git/**,\
  **/build/**,\
  **/*.min.js,\
  **/vendor/**,\
  backend/src/models/**,\
  backend/src/config/**,\
  backend/src/routes/**,\
  backend/src/socket.js,\
  backend/src/app.js,\
  backend/src/middleware/errorMiddleware.js,\
  backend/src/middleware/messageUpload.js,\
  backend/src/middleware/notFound.js,\
  backend/src/middleware/subscriptionMiddleware.js,\
  backend/src/middleware/trialMiddleware.js,\
  backend/src/middleware/uploadProfileMedia.js,\
  backend/src/middleware/uploadProjects.js,\
  backend/src/middleware/validate.js,\
  backend/src/middleware/validations/**,\
  backend/src/utils/email.js,\
  backend/src/utils/emailService.js,\
  backend/src/utils/generateToken.js,\
  backend/src/utils/hashPassword.js,\
  backend/src/utils/ipGeo.js,\
  backend/src/utils/meetingLink.js,\
  backend/src/utils/orderEmail.js,\
  backend/src/utils/twilioVerify.js,\
  backend/src/modules/availability/**,\
  backend/src/modules/disputes/**,\
  backend/src/modules/docs/**,\
  backend/src/modules/marketplace/**,\
  backend/src/modules/meetings/**,\
  backend/src/modules/notifications/**,\
  backend/src/modules/payment/**,\
  backend/src/modules/prescripteur/**,\
  backend/src/modules/promo/**,\
  backend/src/modules/reports/**,\
  backend/src/modules/subscription/**,\
  backend/src/modules/weather/**,\
  backend/src/modules/ai-assistant/chat.service.js,\
  backend/src/modules/ai-assistant/prompts.js,\
  backend/src/modules/catalog/recommendations.js,\
  backend/src/modules/catalog/video.service.js,\
  backend/src/modules/artisan/artisan.controller.js,\
  backend/src/modules/artisan/artisan.service.js,\
  backend/src/modules/admin/admin.controller.js,\
  backend/src/modules/admin/admin.service.js

# ── Language ──────────────────────────────────────────────────────────────────
sonar.language=js
sonar.javascript.environments=node,browser

# ── Quality Gate ──────────────────────────────────────────────────────────────
sonar.qualitygate.wait=false
