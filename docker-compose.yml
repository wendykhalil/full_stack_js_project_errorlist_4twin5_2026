version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# BMP.tn — Full Application Stack
#
# Start everything: docker-compose up -d
# Backend only:     docker-compose up -d backend
# Frontend only:    docker-compose up -d frontend
#
# For monitoring:   docker-compose -f docker-compose.monitoring.yml up -d
# For Jenkins:      docker-compose -f docker-compose.jenkins.yml up -d
# ─────────────────────────────────────────────────────────────────────────────

networks:
  app:
    driver: bridge

volumes:
  mongo_data: {}
  uploads_data: {}

services:

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bmp-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - CLIENT_ORIGIN=http://localhost:5173
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: bmp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
