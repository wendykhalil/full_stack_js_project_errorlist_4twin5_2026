name: CD Frontend

on:
  workflow_run:
    workflows: ["CI Frontend"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bmp-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/bmp-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Update frontend image in Kubernetes
        run: |
          kubectl set image deployment/bmp-frontend \
            frontend=${{ secrets.DOCKER_USERNAME }}/bmp-frontend:${{ github.sha }} \
            -n bmp-production
          kubectl rollout status deployment/bmp-frontend -n bmp-production --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n bmp-production -l app=bmp-frontend
          kubectl get svc -n bmp-production

      - name: Notify on failure
        if: failure()
        run: |
          echo "Frontend deployment FAILED for commit ${{ github.sha }}"
