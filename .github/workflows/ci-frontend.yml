name: CI Frontend

on:
  push:
    branches: [main, develop, user]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'

  workflow_dispatch:

jobs:
  test-and-build:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci && npm install terser --save-dev

      # ── Unit Tests ───────────────────────────────────────────────────────────
      - name: Run unit tests with coverage
        working-directory: frontend
        run: npx vitest run --coverage --reporter=verbose --reporter=junit --outputFile=junit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-results
          path: frontend/junit.xml
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      # ── Lint (warnings only, never fails pipeline) ───────────────────────────
      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present
        continue-on-error: true

      # ── Production Build ─────────────────────────────────────────────────────
      - name: Build production bundle
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

      # ── Docker Build Verify ──────────────────────────────────────────────────
      - name: Build Docker image (verify)
        working-directory: frontend
        run: docker build -t bmp-frontend:ci-${{ github.sha }} .
