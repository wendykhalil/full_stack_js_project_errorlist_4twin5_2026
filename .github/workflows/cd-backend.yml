name: CD Backend

on:
  workflow_run:
    workflows: ["CI Backend"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/bmp-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/bmp-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Update backend image in Kubernetes
        run: |
          kubectl set image deployment/bmp-backend \
            backend=${{ secrets.DOCKER_USERNAME }}/bmp-backend:${{ github.sha }} \
            -n bmp-production
          kubectl rollout status deployment/bmp-backend -n bmp-production --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n bmp-production -l app=bmp-backend
          kubectl get svc -n bmp-production

      - name: Notify on failure
        if: failure()
        run: |
          echo "Backend deployment FAILED for commit ${{ github.sha }}"
          # Add Slack/email notification here if needed
