name: CD Backend

on:
  workflow_run:
    workflows: ["CI Backend"]
    types: [completed]

jobs:
  build-and-deploy:
    name: Build backend image and deploy
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t pilastversion-backend:${{ github.sha }} ./backend

      - name: Save backend Docker image artifact
        run: docker save pilastversion-backend:${{ github.sha }} -o backend-image.tar

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-image
          path: backend-image.tar

      - name: Deploy backend to kubeadm cluster
        if: ${{ secrets.KUBE_CONFIG != '' }}
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          kubectl apply -f devops/k8s/namespace.yml
          kubectl apply -f devops/k8s/backend-deployment.yml
