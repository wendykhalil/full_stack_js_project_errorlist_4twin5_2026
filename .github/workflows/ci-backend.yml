name: CI Backend

on:
  push:
    branches: [ main, user, dev ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, user, dev ]
    paths:
      - 'backend/**'

jobs:
  test-and-sonar:
    name: Backend tests and SonarQube
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend unit tests with coverage
        run: npm test -- --coverage

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: SonarQube backend scan
        if: ${{ secrets.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=pilastversion-backend
            -Dsonar.projectName=pilastversion-backend
            -Dsonar.sources=backend/src
            -Dsonar.tests=backend/tests
            -Dsonar.test.inclusions=backend/tests/**/*.test.js
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/uploads/**,**/.git/**
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
