name: CI Backend

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
  workflow_dispatch:  # Allow manual trigger from GitHub Actions UI

jobs:
  test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # ── Unit Tests (Jest) ────────────────────────────────────────────────────
      - name: Run unit tests with coverage
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret-ci
        run: npm test -- --coverage --runInBand --forceExit

      - name: Upload test results (JUnit)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/junit.xml
          retention-days: 7

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

      # ── SonarQube ────────────────────────────────────────────────────────────
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        if: github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=bmp-fullstack
            -Dsonar.projectName=BMP.tn Full Stack
            -Dsonar.sources=backend/src
            -Dsonar.tests=backend/tests
            -Dsonar.test.inclusions=backend/tests/**/*.test.js
            -Dsonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/uploads/**,backend/src/models/**,backend/src/config/**,backend/src/routes/**,backend/src/socket.js,backend/src/app.js

      # ── Docker Build Verify ──────────────────────────────────────────────────
      - name: Build Docker image (verify)
        working-directory: backend
        run: docker build -t bmp-backend:ci-${{ github.sha }} .
