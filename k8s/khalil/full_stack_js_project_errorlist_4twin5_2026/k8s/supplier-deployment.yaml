apiVersion: apps/v1
kind: Deployment
metadata:
  name: supplier
  namespace: bmp-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: supplier
  template:
    metadata:
      labels:
        app: supplier
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "80"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: supplier
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"