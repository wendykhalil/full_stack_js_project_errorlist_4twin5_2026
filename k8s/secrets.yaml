# ⚠️  DO NOT commit real values — use kubectl create secret or Sealed Secrets
# Apply with: kubectl apply -f k8s/secrets.yaml
# Or create via CLI:
#   kubectl create secret generic bmp-secrets \
#     --from-literal=MONGO_URI='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=CLOUDINARY_CLOUD_NAME='...' \
#     --from-literal=CLOUDINARY_API_KEY='...' \
#     --from-literal=CLOUDINARY_API_SECRET='...' \
#     -n bmp-production
apiVersion: v1
kind: Secret
metadata:
  name: bmp-secrets
  namespace: bmp-production
type: Opaque
stringData:
  MONGO_URI: "REPLACE_WITH_REAL_VALUE"
  JWT_SECRET: "REPLACE_WITH_REAL_VALUE"
  CLOUDINARY_CLOUD_NAME: "REPLACE_WITH_REAL_VALUE"
  CLOUDINARY_API_KEY: "REPLACE_WITH_REAL_VALUE"
  CLOUDINARY_API_SECRET: "REPLACE_WITH_REAL_VALUE"
