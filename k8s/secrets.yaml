apiVersion: v1
kind: Secret
metadata:
  name: bmp-secrets
  namespace: bmp-production
  labels:
    app: bmp
type: Opaque
# Values are base64-encoded — replace with real values before deploying
# echo -n "your-value" | base64
stringData:
  MONGO_URI: "mongodb+srv://user:pass@cluster.mongodb.net/bmp"
  JWT_SECRET: "change-me-in-production-use-strong-secret"
  CLOUDINARY_CLOUD_NAME: "your-cloud-name"
  CLOUDINARY_API_KEY: "your-api-key"
  CLOUDINARY_API_SECRET: "your-api-secret"
